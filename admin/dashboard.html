<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel admin · Nagomi Candles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div class="admin-shell">
  <div class="admin-topbar">
    <span class="logo-title">Nagomi<em>Candles</em> · admin</span>
    <div class="admin-user">
      <span id="adminUserLabel"></span>
      <span class="badge-demo" data-demo-badge style="display:none">Modo demo</span>
      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <main class="admin-main">
    <div class="admin-tabs">
      <button class="admin-tab is-active" data-tab="catalogo">Catálogo</button>
      <button class="admin-tab" data-tab="mensajes">Mensajes de contacto</button>
    </div>

    <!-- CATALOGO -->
    <section class="admin-panel is-active" id="panel-catalogo">
      <div class="admin-toolbar">
        <h2>Gestionar velas</h2>
        <button class="btn btn-primary btn-sm" id="newProductBtn">+ Nueva vela</button>
      </div>

      <form id="productForm" class="form-card" style="display:none; max-width:none; margin-bottom:22px;">
        <input type="hidden" id="productId">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-field">
            <label for="pName">Nombre</label>
            <input type="text" id="pName" placeholder="Ej. Luna de Lavanda">
          </div>
          <div class="form-field">
            <label for="pScent">Aroma</label>
            <select id="pScent" style="width:100%; border:2px solid rgba(110,90,158,.18); border-radius:12px; padding:12px 14px; font-family:var(--font-body); background:#FCFAFF;">
              <option value="lavanda">Lavanda</option>
              <option value="vainilla">Vainilla</option>
              <option value="citrico">Cítrico</option>
              <option value="oceano">Océano</option>
              <option value="floral">Floral</option>
              <option value="matcha">Té verde</option>
            </select>
          </div>
          <div class="form-field">
            <label for="pPrice">Precio (USD)</label>
            <input type="number" id="pPrice" min="0" step="1" placeholder="18">
          </div>
          <div class="form-field">
            <label for="pStock">Inventario</label>
            <input type="number" id="pStock" min="0" step="1" placeholder="12">
          </div>
        </div>
        <div class="form-field">
          <label for="pDesc">Descripción</label>
          <textarea id="pDesc" placeholder="Notas de aroma, inspiración..."></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary btn-sm">Guardar vela</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelProductBtn">Cancelar</button>
        </div>
        <p class="form-status" id="productStatus"></p>
      </form>

      <div id="productsState"></div>
      <div class="admin-table-wrap" id="productsTableWrap" style="display:none;">
        <table class="admin-table">
          <thead>
            <tr><th></th><th>Nombre</th><th>Aroma</th><th>Precio</th><th>Inventario</th><th></th></tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- MENSAJES -->
    <section class="admin-panel" id="panel-mensajes">
      <div class="admin-toolbar"><h2>Mensajes de contacto</h2></div>
      <div id="messagesState"></div>
      <div id="messagesList"></div>
    </section>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
