<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel admin · Nagomi Candles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <a href="../index.html" class="logo">
      <svg class="logo-mark" width="46" height="46" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#B9E7E4"/><stop offset="0.55" stop-color="#D8C6F2"/><stop offset="1" stop-color="#F7C6D9"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="58" fill="url(#logoGrad)"/>
        <path d="M2 80 Q 22 66, 42 80 T 82 80 T 122 80 V122 H2 Z" fill="#7FC4C8" opacity="0.65"/>
        <path d="M2 92 Q 22 78, 42 92 T 82 92 T 122 92 V122 H2 Z" fill="#5AAEB3" opacity="0.75"/>
        <path d="M60 40 C 55 48, 55 55, 60 60 C 65 55, 65 48, 60 40 Z" fill="#FFD897"/>
        <path d="M92 30 l2.6 6.4 6.4 2.6-6.4 2.6-2.6 6.4-2.6-6.4-6.4-2.6 6.4-2.6z" fill="#fff" opacity="0.95"/>
      </svg>
      <span class="logo-text"><span class="logo-title">Nagomi<em>Candles</em></span></span>
    </a>
    <h2 style="margin-top:18px;">Panel de administrador</h2>
    <p style="color:var(--ink-soft); font-size:.9rem; margin-top:-8px;">Inicia sesión para gestionar el catálogo y los mensajes.</p>

    <form id="loginForm" novalidate style="margin-top:20px;">
      <div class="form-field">
        <label for="username">Usuario</label>
        <input type="text" id="username" autocomplete="username" placeholder="admin">
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Iniciar sesión</button>
      <p class="form-status" id="loginStatus"></p>
    </form>

    <p class="demo-hint">💡 Si el backend no está conectado, la app entra en modo demostración con el usuario <strong>admin</strong> y contraseña <strong>nagomi2026</strong>.</p>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/admin-login.js"></script>
</body>
</html>
